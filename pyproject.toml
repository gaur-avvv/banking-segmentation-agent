[project]
name = "banking-segmentation-agent"
version = "0.1.0"
description = "Auditable retail-banking segmentation and personalization workflow"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "pydantic>=2.6",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "joblib>=1.3",
  "matplotlib>=3.8",
  "google-genai>=1.0",
  "openai>=1.40",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
banking-agent = "banking_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
